spring.application.name=surge-service

# Yalnızca sağlık ucu için
server.port=8091

spring.kafka.bootstrap-servers=localhost:9094
routemesh.surge.streams-enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

routemesh.auth.token-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/token
routemesh.auth.client-id=surge-service
routemesh.auth.client-secret=${SURGE_CLIENT_SECRET:surge-service-dev-secret}

spring.grpc.client.channel.pricing.target=static://localhost:9093
spring.grpc.client.channel.pricing.default.deadline=5s

# Arz: son 5 dk içinde görülmüş IDLE kuryeler. Talep: son 15 dk içinde oluşan gönderiler.
# Çarpan = clamp(10000 + floor((talep / max(arz, 1) - 1) * 5000), 10000, 25000); talep < 3 ise 10000.
routemesh.surge.supply-window=5m
routemesh.surge.demand-window=15m
routemesh.surge.tick=30s
routemesh.surge.min-demand=3
routemesh.surge.max-bps=25000
routemesh.surge.min-change-bps=500
routemesh.surge.max-decay-step-bps=1000
routemesh.surge.redis-ttl=10m
routemesh.surge.zone-cell-degrees=0.005

# Gözlemlenebilirlik: metrikler Prometheus için, izler OTLP ile Tempo için. İz ihracı yerelde kapalı (compose açar). Uçlar yalnızca iç ağdan erişilir.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.grpc.server=true
management.metrics.distribution.percentiles-histogram.grpc.client=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
