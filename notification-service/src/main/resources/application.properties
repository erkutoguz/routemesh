spring.application.name=notification-service

server.port=8093
spring.mvc.problemdetails.enabled=true

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=notification_app
spring.datasource.password=notification_app_dev

spring.flyway.user=notification_owner
spring.flyway.password=notification_owner_dev

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=notification-service
# Yeni grup eski olayları yeniden oynatıp geçmiş gönderiler için SMS/OTP üretmesin: yalnızca yeni olaylar
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

spring.grpc.client.channel.shipment.target=static://localhost:9092
spring.grpc.client.channel.shipment.default.deadline=10s

routemesh.auth.token-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/token
routemesh.auth.client-id=notification-service
routemesh.auth.client-secret=${NOTIFICATION_CLIENT_SECRET:notification-service-dev-secret}

routemesh.notification.consumer-enabled=true
routemesh.notification.dlt-suffix=.notification-service.dlt
routemesh.notification.retry-attempts=5
routemesh.notification.retry-initial-interval=1s
routemesh.notification.retry-max-interval=16s
routemesh.notification.inbox-retention=30d
routemesh.notification.inbox-cleanup-cron=0 30 3 * * *
# Yalnızca yerel E2E için: simüle SMS gövdesini (OTP dahil) loga yazar. Varsayılan kapalı.
routemesh.notification.sms.log-body=false
# Geliştirme/test: alıcı SMS metinlerini (OTP dahil) bu dosyaya açık yazar; boş = kapalı, prod profilinde verilemez
routemesh.notification.sms.sink-file=

# Gözlemlenebilirlik: metrikler Prometheus için, izler OTLP ile Tempo için. İz ihracı yerelde kapalı (compose açar). Uçlar yalnızca iç ağdan erişilir.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.grpc.server=true
management.metrics.distribution.percentiles-histogram.grpc.client=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
