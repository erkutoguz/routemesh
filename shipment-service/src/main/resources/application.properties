spring.application.name=shipment-service

server.port=8082
spring.grpc.server.port=9092

spring.mvc.problemdetails.enabled=true

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

spring.datasource.url=jdbc:postgresql://localhost:5432/shipment
spring.datasource.username=shipment_app
spring.datasource.password=shipment_app_dev

spring.flyway.user=shipment_owner
spring.flyway.password=shipment_owner_dev

routemesh.outbox.retention=7d
routemesh.outbox.cleanup-cron=0 0 3 * * *
