apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Exemplar'daki trace_id etiketi Tempo'daki ize bağlanır
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # İze bakarken ilgili servisin istek hızı / hata / gecikme grafiklerine geçiş
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: application
        queries:
          - name: İstek hızı
            query: sum(rate(http_server_requests_seconds_count{$$__tags}[1m]))
          - name: 5xx hızı
            query: sum(rate(http_server_requests_seconds_count{$$__tags, status=~"5.."}[1m]))
          - name: p95 gecikme
            query: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{$$__tags}[1m])))
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
