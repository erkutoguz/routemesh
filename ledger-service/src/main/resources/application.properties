spring.application.name=ledger-service

spring.grpc.server.port=9091

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger_app
spring.datasource.password=ledger_app_dev

spring.flyway.user=ledger_owner
spring.flyway.password=ledger_owner_dev

routemesh.outbox.retention=7d
routemesh.outbox.cleanup-cron=0 0 3 * * *

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api
