spring.application.name=shipment-service

server.port=8082
spring.grpc.server.port=9092

spring.mvc.problemdetails.enabled=true

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

spring.datasource.url=jdbc:postgresql://localhost:5432/shipment
spring.datasource.username=shipment_app
spring.datasource.password=shipment_app_dev

spring.flyway.user=shipment_owner
spring.flyway.password=shipment_owner_dev

routemesh.outbox.retention=7d
routemesh.outbox.cleanup-cron=0 0 3 * * *

# Teslimat kanıtı: dosyalar S3 uyumlu depoda (docker/ altındaki minio, 9100)
routemesh.pod.max-files-per-shipment=5
routemesh.pod.storage.endpoint=http://localhost:9100
routemesh.pod.storage.bucket=routemesh-pod
routemesh.pod.storage.access-key=shipment-pod
routemesh.pod.storage.secret-key=${POD_STORAGE_SECRET:shipment_pod_dev_secret}
# Alıcı OTP'lerini HMAC'lemek için sunucu sırrı (en az 16 karakter); üretimde ortam değişkeniyle verilir
routemesh.pod.otp.secret=${POD_OTP_SECRET:dev-only-otp-secret-change-me-0123456789}
routemesh.pod.otp.ttl=24h
# Dosya sınırı 5 MB (kural); istek sınırı form alanları için biraz daha geniş
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
