spring.application.name=workflow-service

server.port=8086
spring.mvc.problemdetails.enabled=true

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

routemesh.temporal.target=localhost:7233
routemesh.temporal.namespace=routemesh
routemesh.temporal.task-queue=shipment
routemesh.temporal.worker-enabled=true

routemesh.auth.token-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/token
routemesh.auth.client-id=workflow-service
routemesh.auth.client-secret=${WORKFLOW_CLIENT_SECRET:workflow-service-dev-secret}

spring.grpc.client.channel.pricing.target=static://localhost:9093
spring.grpc.client.channel.shipment.target=static://localhost:9092
spring.grpc.client.channel.payment.target=static://localhost:9095
spring.grpc.client.channel.ledger.target=static://localhost:9091
spring.grpc.client.channel.pricing.default.deadline=10s
spring.grpc.client.channel.shipment.default.deadline=10s
spring.grpc.client.channel.payment.default.deadline=15s
spring.grpc.client.channel.ledger.default.deadline=10s
