spring.application.name=location-service

# Bu süre boyunca konum göndermeyen kurye yakın kurye aramalarından elenir
routemesh.location.stale-after=60s
routemesh.location.state-ttl=24h
routemesh.location.eviction-interval=30s
# FindNearestCouriers: limit verilmezse (0) varsayılan, üst sınırı aşan değer bu sınıra indirilir
routemesh.location.default-limit=20
routemesh.location.max-limit=100
# FindNearestCouriers: izin verilen en büyük arama yarıçapı (metre)
routemesh.location.max-radius-meters=15000

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api
