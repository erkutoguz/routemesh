name: routemesh

x-app-build: &app-build
  context: ..
  dockerfile: docker/service.Dockerfile

x-app: &app
  restart: unless-stopped
  profiles:
    - apps
  mem_limit: 512m

x-security-env: &security-env
  ROUTEMESH_SECURITY_JWK_SET_URI: http://keycloak:8180/realms/routemesh/protocol/openid-connect/certs

x-token-env: &token-env
  ROUTEMESH_AUTH_TOKEN_URI: http://keycloak:8180/realms/routemesh/protocol/openid-connect/token

x-kafka-env: &kafka-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

services:
  redis:
    image: redis:8.10.3
    container_name: routemesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgis/postgis:16-3.7-alpine
    container_name: routemesh-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    container_name: routemesh-kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: routemesh-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - >
        for topic in shipment.events ledger.events payment.events fleet.events location.events; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic $$topic --partitions 3 --replication-factor 1 --config retention.ms=604800000 || exit 1;
        done;
        for topic in shipment.events.notification-service.dlt fleet.events.notification-service.dlt location.events.notification-service.dlt shipment.events.search-service.dlt; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic $$topic --partitions 3 --replication-factor 1 --config retention.ms=1209600000 || exit 1;
        done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic courier.locations --partitions 6 --replication-factor 1 --config retention.ms=3600000 || exit 1

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: routemesh-connect
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: routemesh-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  connect-init:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: routemesh-connect-init
    profiles:
      - cdc-register
      - apps
    depends_on:
      connect:
        condition: service_healthy
      # Yayın (publication) ve outbox tabloları servislerin Flyway göçleriyle oluşur; servisler sağlıklı olmadan kayıt başarısız olur
      shipment-service:
        condition: service_healthy
        required: false
      ledger-service:
        condition: service_healthy
        required: false
      payment-service:
        condition: service_healthy
        required: false
      fleet-service:
        condition: service_healthy
        required: false
    restart: "no"
    volumes:
      - ./debezium:/connectors:ro
    entrypoint:
      - sh
      - -c
      - >
        for name in shipment-outbox ledger-outbox payment-outbox fleet-outbox; do
        curl -sf -X PUT -H 'Content-Type: application/json'
        --data @/connectors/$$name.json
        http://connect:8083/connectors/$$name/config > /dev/null || exit 1;
        done;
        sleep 5;
        for name in shipment-outbox ledger-outbox payment-outbox fleet-outbox; do
        curl -s http://connect:8083/connectors/$$name/status; echo;
        [ "$$(curl -s http://connect:8083/connectors/$$name/status | grep -o RUNNING | wc -l)" -ge 2 ] || exit 1;
        done

  keycloak:
    build:
      context: ./keycloak
    image: routemesh/keycloak:26.8.2
    container_name: routemesh-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8180"
      - "9000:9000"
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  temporal-postgres:
    image: postgres:16-alpine
    container_name: routemesh-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_dev
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: routemesh-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_dev
      POSTGRES_SEEDS: temporal-postgres
      DEFAULT_NAMESPACE: routemesh
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.58.1
    container_name: routemesh-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: routemesh

  # S3 uyumlu nesne deposu (teslimat kanıtı fotoğrafları). Servisler yalnızca S3 API'sini kullanır, imaj değiştirilebilir.
  # Docker Hub'daki minio/minio ve minio/mc depoları kaldırıldı; Chainguard kaynak koddan derlenen
  # imajı kullanılır ve digest ile sabitlenir (-dev varyantı: sh ve wget sağlık denetimi/init için gerekli).
  minio:
    image: cgr.dev/chainguard/minio@sha256:99d9c9437fc6cefa47ea66eb0fbccfaa521272f5885fbd0520e0334415b767f7
    container_name: routemesh-minio
    entrypoint: ["minio"]
    command: ["server", "/data", "--address", ":9100", "--console-address", ":9101"]
    ports:
      - "9100:9100"
      - "9101:9101"
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: minio_root_dev_secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # routemesh-pod bucket'ını (herkese kapalı) ve yalnızca bu bucket'a okuma/yazma yetkili servis kullanıcısını kurar.
  # Silme yetkisi bilerek yok: teslimat kanıtı değişmezdir.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:11c116267e67aae889193021e0d7d5b7f611dc5ce688ae42b99f586dffd40316
    container_name: routemesh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: minio_root_dev_secret
      POD_ACCESS_KEY: shipment-pod
      POD_SECRET_KEY: shipment_pod_dev_secret
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9100 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/routemesh-pod &&
        mc anonymous set none local/routemesh-pod &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::routemesh-pod/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::routemesh-pod"]}]}' > /tmp/pod-policy.json &&
        mc admin policy create local pod-readwrite /tmp/pod-policy.json &&
        mc admin user add local "$$POD_ACCESS_KEY" "$$POD_SECRET_KEY" &&
        mc admin policy attach local pod-readwrite --user "$$POD_ACCESS_KEY" || mc admin policy attach local pod-readwrite --user "$$POD_ACCESS_KEY" 2>&1 | grep -qi "already"

  # ---------------------------------------------------------------------------------------------------------
  # Uygulamalar (profil: apps). Altyapı varsayılan kalır; `docker compose --profile apps up -d` hepsini kaldırır.
  # Jar'ların varsayılan (localhost) ayarlarına dokunulmaz, iç ağ adresleri ortam değişkenleriyle verilir.
  # Konak portu yalnızca gateway (8080), keycloak (8180, yukarıda) ve demo/E2E için psp-simulator (8085) açar;
  # diğer servisler yalnızca iç ağdadır. Token `iss` değeri http://localhost:8180 kalır (KC_HOSTNAME), JWKS ve token
  # uçları ise konteyner ağından keycloak:8180 üzerinden okunur.
  # ---------------------------------------------------------------------------------------------------------

  api-gateway:
    <<: *app
    build: {<<: *app-build, args: {MODULE: api-gateway, HTTP_PORT: "8080"}}
    image: routemesh/api-gateway:dev
    container_name: routemesh-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *security-env
      ROUTEMESH_UPSTREAMS_SHIPMENT: http://shipment-service:8082
      ROUTEMESH_UPSTREAMS_WORKFLOW: http://workflow-service:8086
      ROUTEMESH_UPSTREAMS_FLEET: http://fleet-service:8087
      ROUTEMESH_UPSTREAMS_TRACKING: http://location-service:8089
      ROUTEMESH_UPSTREAMS_LEDGER: http://ledger-service:8090
      ROUTEMESH_UPSTREAMS_NOTIFICATION: http://notification-service:8093
      ROUTEMESH_UPSTREAMS_SEARCH: http://search-service:8092
      ROUTEMESH_UPSTREAMS_PAYMENT: http://payment-service:8084
    depends_on:
      keycloak:
        condition: service_healthy

  shipment-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: shipment-service, HTTP_PORT: "8082"}}
    image: routemesh/shipment-service:dev
    container_name: routemesh-shipment-service
    environment:
      <<: *security-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment
      ROUTEMESH_POD_STORAGE_ENDPOINT: http://minio:9100
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  pricing-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: pricing-service, HTTP_PORT: "8094"}}
    image: routemesh/pricing-service:dev
    container_name: routemesh-pricing-service
    environment:
      <<: *security-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricing
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ledger-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: ledger-service, HTTP_PORT: "8090"}}
    image: routemesh/ledger-service:dev
    container_name: routemesh-ledger-service
    environment:
      <<: *security-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  payment-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: payment-service, HTTP_PORT: "8084"}}
    image: routemesh/payment-service:dev
    container_name: routemesh-payment-service
    environment:
      <<: [*security-env, *token-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_GRPC_CLIENT_CHANNEL_LEDGER_TARGET: static://ledger-service:9091
      ROUTEMESH_PAYMENT_PSP_BASE_URL: http://psp-simulator:8085
      ROUTEMESH_PAYMENT_WEBHOOK_URL: http://payment-service:8084/api/v1/webhooks/psp
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  psp-simulator:
    <<: *app
    build: {<<: *app-build, args: {MODULE: psp-simulator, HTTP_PORT: "8085"}}
    image: routemesh/psp-simulator:dev
    container_name: routemesh-psp-simulator
    ports:
      - "8085:8085"

  fleet-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: fleet-service, HTTP_PORT: "8087"}}
    image: routemesh/fleet-service:dev
    container_name: routemesh-fleet-service
    environment:
      <<: *security-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  location-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: location-service, HTTP_PORT: "8089"}}
    image: routemesh/location-service:dev
    container_name: routemesh-location-service
    environment:
      <<: [*security-env, *token-env, *kafka-env]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_GRPC_CLIENT_CHANNEL_SHIPMENT_TARGET: static://shipment-service:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  surge-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: surge-service, HTTP_PORT: "8091"}}
    image: routemesh/surge-service:dev
    container_name: routemesh-surge-service
    environment:
      <<: [*token-env, *kafka-env]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_GRPC_CLIENT_CHANNEL_PRICING_TARGET: static://pricing-service:9093
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  notification-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: notification-service, HTTP_PORT: "8093"}}
    image: routemesh/notification-service:dev
    container_name: routemesh-notification-service
    environment:
      <<: [*security-env, *token-env, *kafka-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_GRPC_CLIENT_CHANNEL_SHIPMENT_TARGET: static://shipment-service:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  search-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: search-service, HTTP_PORT: "8092"}}
    image: routemesh/search-service:dev
    container_name: routemesh-search-service
    environment:
      <<: [*security-env, *kafka-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/search
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  workflow-service:
    <<: *app
    build: {<<: *app-build, args: {MODULE: workflow-service, HTTP_PORT: "8086"}}
    image: routemesh/workflow-service:dev
    container_name: routemesh-workflow-service
    environment:
      <<: [*security-env, *token-env, *kafka-env]
      ROUTEMESH_TEMPORAL_TARGET: temporal:7233
      SPRING_GRPC_CLIENT_CHANNEL_PRICING_TARGET: static://pricing-service:9093
      SPRING_GRPC_CLIENT_CHANNEL_SHIPMENT_TARGET: static://shipment-service:9092
      SPRING_GRPC_CLIENT_CHANNEL_PAYMENT_TARGET: static://payment-service:9095
      SPRING_GRPC_CLIENT_CHANNEL_LEDGER_TARGET: static://ledger-service:9091
      SPRING_GRPC_CLIENT_CHANNEL_LOCATION_TARGET: static://location-service:9090
      SPRING_GRPC_CLIENT_CHANNEL_FLEET_TARGET: static://fleet-service:9096
    depends_on:
      temporal:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
  kafka-data:
  temporal-postgres-data:
  minio-data:
