name: routemesh CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - location-service
          - ledger-service
          - shipment-service
          - pricing-service
          - payment-service
          - psp-simulator
          - platform-security
          - platform-observability
          - api-gateway
          - workflow-service
          - fleet-service
          - surge-service
          - notification-service
          - search-service

    name: Test ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp -pl ${{ matrix.service }} -am verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.service }}
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Test web
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    needs: [test, web]
    if: always()

    steps:
      - name: Verify test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
            echo "Test jobs finished with result: ${{ needs.test.result }}, web: ${{ needs.web.result }}"
            exit 1
          fi
