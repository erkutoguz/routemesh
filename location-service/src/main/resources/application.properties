spring.application.name=location-service

# Bu süre boyunca konum göndermeyen kurye yakın kurye aramalarından elenir
routemesh.location.stale-after=60s
routemesh.location.state-ttl=24h
routemesh.location.eviction-interval=30s
# FindNearestCouriers: limit verilmezse (0) varsayılan, üst sınırı aşan değer bu sınıra indirilir
routemesh.location.default-limit=20
routemesh.location.max-limit=100
# FindNearestCouriers: izin verilen en büyük arama yarıçapı (metre)
routemesh.location.max-radius-meters=15000

# Yaklaşma izleme: kurye hedefe bu mesafeye girince location.events'e ApproachingDestination yazılır
routemesh.tracking.approach-radius-meters=100
# Tek depo: PICKUP izlemesinin hedefi (workflow-service'teki routemesh.dispatch.depot-* ile aynı olmalı)
routemesh.tracking.depot-latitude=41.0082
routemesh.tracking.depot-longitude=28.9784
routemesh.tracking.consumer-enabled=true
routemesh.tracking.telemetry-enabled=true

routemesh.auth.token-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/token
routemesh.auth.client-id=location-service
routemesh.auth.client-secret=${LOCATION_CLIENT_SECRET:location-service-dev-secret}

spring.grpc.client.channel.shipment.target=static://localhost:9092
spring.grpc.client.channel.shipment.default.deadline=10s

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=location-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka erişilemezken konum akışı ve ingest uzun süre takılmasın
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api
