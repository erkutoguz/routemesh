spring.application.name=payment-service

server.port=8084
spring.grpc.server.port=9095

spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=payment_app
spring.datasource.password=payment_app_dev

spring.flyway.user=payment_owner
spring.flyway.password=payment_owner_dev

spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

routemesh.payment.psp-base-url=http://localhost:8085
routemesh.payment.webhook-secrets=whsec_dev_routemesh
routemesh.payment.webhook-tolerance=5m
routemesh.payment.intent-ttl=15m
routemesh.payment.expiry-grace=1m
routemesh.payment.retry-after=30s
routemesh.payment.max-attempts=10

routemesh.outbox.retention=7d
routemesh.outbox.cleanup-cron=0 0 3 * * *

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

routemesh.payment.reconciliation.scheduler-enabled=true
routemesh.payment.reconciliation.interval=30m
routemesh.payment.reconciliation.initial-delay=2m
routemesh.payment.reconciliation.overlap=1h
routemesh.payment.reconciliation.initial-lookback=24h
routemesh.payment.reconciliation.grace=10m
routemesh.payment.reconciliation.stuck-after=15m
routemesh.payment.reconciliation.stale-run-after=30m
routemesh.payment.reconciliation.page-size=200
routemesh.payment.reconciliation.max-findings-per-run=1000
routemesh.payment.reconciliation.missing-flood-threshold=50
routemesh.payment.reconciliation.max-lookups=1000
