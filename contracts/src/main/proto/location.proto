syntax = "proto3";

package routemesh.location.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.routemesh.contracts.location";

service LocationService {
  rpc StreamCourierLocations(stream CourierLocationTelemetry) returns (StreamCourierLocationsResponse);
  rpc FindNearestCouriers(FindNearestRequest) returns (FindNearestResponse);
}

message CourierLocationTelemetry {
  string courier_id = 1;
  routemesh.common.v1.LatLong location = 2;
  int64 session_epoch = 3;
  int64 sequence_number = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message StreamCourierLocationsResponse {
  int64 accepted = 1;
  int64 rejected_stale = 2;
}

message FindNearestRequest {
  routemesh.common.v1.LatLong target_location = 1;
  double radius_meters = 2;
  int32 limit = 3;
}

message FindNearestResponse {
  repeated CourierDistance couriers = 1;
}

message CourierDistance {
  string courier_id = 1;
  double distance_meters = 2;
}
