spring.application.name=search-service

server.port=8092
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/search
spring.datasource.username=search_app
spring.datasource.password=search_app_dev

spring.flyway.user=search_owner
spring.flyway.password=search_owner_dev

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=search-service
# Okuma modeli konunun tutulan geçmişinden kurulur: yeni grup en baştan okur (projeksiyon idempotenttir)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

routemesh.search.consumer-enabled=true
routemesh.search.dlt-suffix=.search-service.dlt
routemesh.search.retry-attempts=5
routemesh.search.retry-initial-interval=1s
routemesh.search.retry-max-interval=16s
routemesh.search.inbox-retention=30d
routemesh.search.inbox-cleanup-cron=0 45 3 * * *
