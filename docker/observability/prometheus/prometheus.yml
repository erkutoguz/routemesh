# 12 uygulamanın /actuator/prometheus ucu iç ağdan okunur. `job` servis adıdır; metriklerdeki `application` etiketi
# (management.metrics.tags.application) aynı değeri taşır, bu yüzden hedef etiketi olarak ayrıca eklenmez.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["api-gateway:8079"]}]
  - job_name: shipment-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["shipment-service:8082"]}]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["payment-service:8084"]}]
  - job_name: psp-simulator
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["psp-simulator:8085"]}]
  - job_name: workflow-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["workflow-service:8086"]}]
  - job_name: fleet-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["fleet-service:8087"]}]
  - job_name: location-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["location-service:8089"]}]
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["ledger-service:8090"]}]
  - job_name: surge-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["surge-service:8091"]}]
  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["search-service:8092"]}]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["notification-service:8093"]}]
  - job_name: pricing-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["pricing-service:8094"]}]
