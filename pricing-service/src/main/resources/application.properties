spring.application.name=pricing-service

spring.grpc.server.port=9093

spring.datasource.url=jdbc:postgresql://localhost:5432/pricing
spring.datasource.username=pricing_app
spring.datasource.password=pricing_app_dev

spring.flyway.user=pricing_owner
spring.flyway.password=pricing_owner_dev

routemesh.pricing.quote-ttl=10m
routemesh.pricing.max-surge-bps=25000

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api
