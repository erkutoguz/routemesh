spring.application.name=location-service

# Canlı takip (SSE) HTTP portu; gRPC 9090. 8088 Temporal UI'da
server.port=8089
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

# Bu süre boyunca konum göndermeyen kurye yakın kurye aramalarından elenir
routemesh.location.stale-after=60s
routemesh.location.state-ttl=24h
routemesh.location.eviction-interval=30s
# FindNearestCouriers: limit verilmezse (0) varsayılan, üst sınırı aşan değer bu sınıra indirilir
routemesh.location.default-limit=20
routemesh.location.max-limit=100
# FindNearestCouriers: izin verilen en büyük arama yarıçapı (metre)
routemesh.location.max-radius-meters=15000

# Yaklaşma izleme: kurye hedefe bu mesafeye girince location.events'e ApproachingDestination yazılır
routemesh.tracking.approach-radius-meters=100
# Tek depo: PICKUP izlemesinin hedefi (workflow-service'teki routemesh.dispatch.depot-* ile aynı olmalı)
routemesh.tracking.depot-latitude=41.0082
routemesh.tracking.depot-longitude=28.9784
routemesh.tracking.consumer-enabled=true
routemesh.tracking.telemetry-enabled=true

# Canlı takip akışı: kullanıcı başına / toplam eşzamanlı akış, kalp atışı, iki konum olayı arası en az süre,
# akışın en uzun ömrü (token süresi daha erken dolarsa o), izlemenin hâlâ var olduğunun denetim aralığı
routemesh.tracking.sse.max-per-user=5
routemesh.tracking.sse.max-total=1000
routemesh.tracking.sse.heartbeat=15s
routemesh.tracking.sse.min-interval=2s
routemesh.tracking.sse.max-duration=30m
routemesh.tracking.sse.health-interval=5s

routemesh.auth.token-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/token
routemesh.auth.client-id=location-service
routemesh.auth.client-secret=${LOCATION_CLIENT_SECRET:location-service-dev-secret}

spring.grpc.client.channel.shipment.target=static://localhost:9092
spring.grpc.client.channel.shipment.default.deadline=10s

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=location-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka erişilemezken konum akışı ve ingest uzun süre takılmasın
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

# Gözlemlenebilirlik: metrikler Prometheus için, izler OTLP ile Tempo için. İz ihracı yerelde kapalı (compose açar). Uçlar yalnızca iç ağdan erişilir.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.grpc.server=true
management.metrics.distribution.percentiles-histogram.grpc.client=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
