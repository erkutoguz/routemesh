spring.application.name=api-gateway

server.port=8080

routemesh.security.issuer=http://localhost:8180/realms/routemesh
routemesh.security.jwk-set-uri=http://localhost:8180/realms/routemesh/protocol/openid-connect/certs
routemesh.security.audience=routemesh-api

routemesh.upstreams.shipment=http://localhost:8082
routemesh.upstreams.workflow=http://localhost:8086
routemesh.upstreams.fleet=http://localhost:8087
routemesh.upstreams.tracking=http://localhost:8089
routemesh.upstreams.ledger=http://localhost:8090
routemesh.upstreams.notification=http://localhost:8093
routemesh.upstreams.search=http://localhost:8092
routemesh.upstreams.payment=http://localhost:8084
routemesh.upstreams.pricing=http://localhost:8094

# Rota sırası önemlidir: ilk eşleşen kazanır. Liste uçları (search-service) shipment-service'in
# joker rotalarından ÖNCE ve yalnızca GET + tam yol olarak tanımlanır; /ops/shipments/{id}/history
# ve /warehouse/shipments/{id}/receive|ready gibi alt yollar shipment-service'te kalır.
spring.cloud.gateway.server.webmvc.routes[0].id=shipment-create
spring.cloud.gateway.server.webmvc.routes[0].uri=${routemesh.upstreams.workflow}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/shipments
spring.cloud.gateway.server.webmvc.routes[0].predicates[1]=Method=POST

spring.cloud.gateway.server.webmvc.routes[1].id=search
spring.cloud.gateway.server.webmvc.routes[1].uri=${routemesh.upstreams.search}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/search/**

spring.cloud.gateway.server.webmvc.routes[2].id=ops-shipment-list
spring.cloud.gateway.server.webmvc.routes[2].uri=${routemesh.upstreams.search}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/ops/shipments
spring.cloud.gateway.server.webmvc.routes[2].predicates[1]=Method=GET

spring.cloud.gateway.server.webmvc.routes[3].id=warehouse-shipment-list
spring.cloud.gateway.server.webmvc.routes[3].uri=${routemesh.upstreams.search}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/warehouse/shipments
spring.cloud.gateway.server.webmvc.routes[3].predicates[1]=Method=GET

spring.cloud.gateway.server.webmvc.routes[4].id=ops-ledger
spring.cloud.gateway.server.webmvc.routes[4].uri=${routemesh.upstreams.ledger}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/ops/ledger/**

spring.cloud.gateway.server.webmvc.routes[5].id=ops-payments
spring.cloud.gateway.server.webmvc.routes[5].uri=${routemesh.upstreams.payment}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/ops/payments/**

spring.cloud.gateway.server.webmvc.routes[6].id=shipment
spring.cloud.gateway.server.webmvc.routes[6].uri=${routemesh.upstreams.shipment}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/shipments/**,/api/v1/ops/shipments/**,/api/v1/warehouse/shipments/**

spring.cloud.gateway.server.webmvc.routes[7].id=fleet
spring.cloud.gateway.server.webmvc.routes[7].uri=${routemesh.upstreams.fleet}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/fleet/**

spring.cloud.gateway.server.webmvc.routes[8].id=tracking
spring.cloud.gateway.server.webmvc.routes[8].uri=${routemesh.upstreams.tracking}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/v1/tracking/**

spring.cloud.gateway.server.webmvc.routes[9].id=wallets
spring.cloud.gateway.server.webmvc.routes[9].uri=${routemesh.upstreams.ledger}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/v1/wallets/**

spring.cloud.gateway.server.webmvc.routes[10].id=notifications
spring.cloud.gateway.server.webmvc.routes[10].uri=${routemesh.upstreams.notification}
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webmvc.routes[11].id=quotes
spring.cloud.gateway.server.webmvc.routes[11].uri=${routemesh.upstreams.pricing}
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/api/v1/quotes/**,/api/v1/quotes

spring.cloud.gateway.server.webmvc.routes[12].id=courier-location
spring.cloud.gateway.server.webmvc.routes[12].uri=${routemesh.upstreams.tracking}
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/api/v1/couriers/me/location
spring.cloud.gateway.server.webmvc.routes[12].predicates[1]=Method=POST

# Gözlemlenebilirlik: metrikler Prometheus için, izler OTLP ile Tempo için. İz ihracı yerelde kapalı (compose açar). Uçlar yalnızca iç ağdan erişilir.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.grpc.server=true
management.metrics.distribution.percentiles-histogram.grpc.client=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# SSE akışları (tracking) istek başına bir thread tutar; sanal thread'ler Tomcat'in 200'lük havuzunu tüketmez
spring.threads.virtual.enabled=true
# Upstream zaman aşımları. Okuma süresi SSE kalp atışından (15 sn) büyük kalmalı, yoksa canlı akışlar kesilir
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=30s
# Hatalar RFC 9457 Problem Details olarak döner (upstream hataları için bkz. UpstreamFailureHandler)
spring.mvc.problemdetails.enabled=true

# Aktüatör ayrı portta ve konak portuna yayınlanmaz: 8080 dışarı açık olduğundan /actuator/prometheus orada sunulmaz
management.server.port=8079

# İstek gövdesi sınırı (Content-Length): genel uçlar ve PoD dosya yükleme yolu (shipment-service 6 MB'a izin verir)
routemesh.gateway.max-body=1MB
routemesh.gateway.max-upload-body=6MB

# Tarayıcı kökeni (RouteMesh Console). Virgülle ayrılmış liste; ön kontrol (OPTIONS) kimlik doğrulamadan önce yanıtlanır
routemesh.gateway.cors.allowed-origins=http://localhost:3001
