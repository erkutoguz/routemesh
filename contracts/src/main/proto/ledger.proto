syntax = "proto3";

package routemesh.ledger.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.routemesh.contracts.ledger";

service LedgerService {
  rpc PostTransaction(PostTransactionRequest) returns (PostTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

enum EntryDirection {
  ENTRY_DIRECTION_UNSPECIFIED = 0;
  ENTRY_DIRECTION_DEBIT = 1;
  ENTRY_DIRECTION_CREDIT = 2;
}

message LedgerEntry {
  string account_code = 1;
  EntryDirection direction = 2;
  routemesh.common.v1.Money amount = 3;
}

message PostTransactionRequest {
  string idempotency_key = 1;
  string transaction_type = 2;
  string shipment_id = 3;
  repeated LedgerEntry entries = 4;
  optional string reversal_of = 5;
}

message PostTransactionResponse {
  string transaction_id = 1;
  bool replayed = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetBalanceRequest {
  string account_code = 1;
  optional string shipment_id = 2;
}

message GetBalanceResponse {
  string account_code = 1;
  routemesh.common.v1.Money balance = 2;
}
